[project]
name = "nlweb-widget-examples"
version = "0.1.8"
description = "Reference integrations, tutorials, and AI visibility demonstrations for nlweb-widget."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "nlweb-widget[sqlite]>=0.9.12,<0.10",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "flask>=3,<4",
    "django>=5,<6",
    "starlette>=0.40,<1",
    "httpx>=0.27,<1",
    "numpy>=2.2,<2.3",
    "pytest>=8,<9",
    "anyio>=4.13,<4.14",
    "haystack-ai>=2.21,<3",
    "sentence-transformers>=3,<6",
    "openai>=1.50,<2",
    "pypdf>=5,<7",
    "fonttools>=4.55,<5",
    "python-dotenv>=1,<2",
    "python-pptx>=1,<2",
    "python-docx>=1,<2",
    "markdown-it-py>=3,<5",
    "mdit_plain>=1,<2",
    "trafilatura>=1.8,<3",
    "jq>=1.10,<2",
    "openpyxl>=3.1,<4",
    "tabulate>=0.9,<1",
    "pandas>=2.2,<3",
    "qdrant-edge-py>=0.8,<0.9",
    "qdrant-client>=1.12,<2",
]

[project.optional-dependencies]
external-scrapegraphai = [
    "scrapegraphai==2.3.1",
]
external-beautifulsoup = [
    "beautifulsoup4>=4.12,<5",
]
widget-all = [
    "nlweb-widget[fastapi,flask,django,starlette,sqlite,postgres,neo4j,haystack,qdrant,qdrant-edge,documents,embeddings,semantic]>=0.9.12,<0.10",
]

remote-storage = ["fsspec>=2024.6.0", "s3fs>=2024.6.0"]
local-scrapy-ollama = ["scrapy>=2.13,<3"]
local-scrapy-transformers = ["scrapy>=2.13,<3", "transformers>=4.46,<5", "torch>=2.4,<3", "accelerate>=0.26,<2"]

[dependency-groups]
# Nomic Embed v2 MoE uses custom Hugging Face model code that imports einops.
# Keep this model-specific runtime dependency out of the default environment.
benchmark-nomic-v2-moe = ["einops>=0.8,<1"]
# Optional Hugging Face Xet transport acceleration for compatible Hub repositories.
benchmark-huggingface-downloads = ["hf-xet>=1,<2"]
# DISABLED BY DEFAULT: optional GPU-only Nomic MegaBlocks optimization.
# Hardware/toolchain prerequisites: a supported NVIDIA GPU/CUDA + compatible PyTorch,
# a working native build toolchain, and enough RAM/disk for a source build. Do not enable
# on CPU-only or low-resource (e.g. dual-core/4 GB RAM) systems. The model falls back to
# its slower built-in path when MegaBlocks is unavailable. To opt in on a compatible GPU,
# uncomment the group below, then install it explicitly with uv.
# benchmark-nomic-v2-moe-gpu = [
#     "megablocks @ git+https://github.com/nomic-ai/megablocks.git",
# ]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.8,<1",
    "zensical>=0.0.1,<1",
    "sqlalchemy[asyncio]>=2,<3",
    "asyncpg>=0.29,<1",
    "neo4j>=6,<7",
]
visibility = [
    "openai>=1.50,<2",
    "sentence-transformers>=3,<6",
]
# Optional MTEB public-task evaluation is deliberately NOT enabled as an active group.
# Its datasets -> PyArrow/native-scikit-learn dependency stack crashed with Windows
# STATUS_ILLEGAL_INSTRUCTION (0xC000001D) on legacy x86-64 hardware without AVX.
# Opt in only on a modern 64-bit CPU with a compatible SIMD/native-wheel stack;
# 8 GB RAM is a practical minimum for small tasks and 16 GB+ is recommended for
# larger multilingual tasks. Verify `import pyarrow, sklearn` before enabling it.
# To opt in locally, uncomment the following group and run `uv sync --group benchmark-mteb`:
# benchmark-mteb = [
#     "mteb>=2.2,<3",
# ]

[tool.uv]
# This repository is a runnable examples/test workspace, not a distributable package.
# Do not build/install the examples project itself when syncing this environment.
package = false

# Widget developers can switch the runtime dependency to a local sibling checkout:
# uv add --editable ../nlweb_widget

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E402"]