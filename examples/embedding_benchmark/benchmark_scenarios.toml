# Workspace-owned scenario catalogue. Edit this file to add or tune benchmark runs.
# Supported source format is JSONL with the benchmark Document / Query schema.
# Every scenario compares models against the same registry-selected corpus and judgments.

[scenario_types.models_one_embedder]
title = "One embedder, one corpus, one or more models"
description = "Compares one or more models through a single embedding backend against identical data."

[scenario_types.two_embedders_one_model_family]
title = "Two embedders, compatible baseline model family, one corpus"
description = "Compares the same model family across two embedding backends."

[scenarios.st-e5-small]
type = "models_one_embedder"
description = "Sentence Transformers model sweep: intfloat/multilingual-e5-small."
source_registry = "nlweb-sources.json"
corpus_source = "benchmark-corpus"
query_source = "benchmark-queries"
top_k = 5
max_cosine_distance = 0.35
primary_metric = "tracks.hybrid_rrf.ndcg_at_10"

[[scenarios.st-e5-small.runs]]
name = "e5-small"
backend = "sentence-transformers"
model = "intfloat/multilingual-e5-small"
device = "cpu"
batch_size = 1
trust_remote_code = false
query_prefix = "query: "
document_prefix = "passage: "

